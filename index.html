<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>আমার হিসাব Pro</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{
box-sizing:border-box
}

body{
margin:0;
background:#f4f6f8;
font-family:
system-ui,
"Noto Sans Bengali",
sans-serif;
color:#111827
}

main{
max-width:900px;
margin:auto;
padding:15px
}

.card{
background:white;
padding:15px;
border-radius:16px;
margin-bottom:15px;
border:1px solid #ddd
}

input,button,select,textarea{
width:100%;
padding:12px;
margin-top:8px;
border-radius:12px;
border:1px solid #ccc;
font-size:16px
}

button{
font-weight:bold;
cursor:pointer
}

.primary{
background:#111827;
color:white
}

.hidden{
display:none
}

.tabs{
display:flex;
gap:8px;
overflow:auto
}

.tabs button{
width:auto
}

.money{
font-size:22px;
font-weight:bold
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.row{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #eee
}

.muted{
color:#666
}
</style>

</head>

<body>

<main id="app">

<div id="loginBox" class="card">

<h2>🔐 আমার হিসাব Pro</h2>

<p class="muted">
Email এবং Password দিয়ে Login করুন
</p>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">


<button id="signupBtn" class="primary">
নতুন অ্যাকাউন্ট তৈরি
</button>

<button id="loginBtn">
Login
</button>

<p id="loginMsg"></p>

</div>


<div id="dashboard" class="hidden">


<div class="tabs">

<button class="primary">
📊 Dashboard
</button>

<button>
➕ হিসাব
</button>

<button>
📈 রিপোর্ট
</button>

<button>
⏰ Reminder
</button>

<button id="logoutBtn">
Logout
</button>

</div>


<div class="card">

<h2>
আমার হিসাব Pro
</h2>

<p class="muted">
দৈনিক হিসাব ব্যবস্থাপনা
</p>

</div>


<div class="grid">

<div class="card">
<div>মোট আয়</div>
<div class="money">
৳0
</div>
</div>


<div class="card">
<div>মোট ব্যয়</div>
<div class="money">
৳0
</div>
</div>

</div>


</div>

</main>

<script>

</script>

</body>
</html>
