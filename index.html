<!doctype html>
<html lang="bn">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>আমার হিসাব Pro</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

body{
margin:0;
background:#f4f6f8;
font-family:sans-serif;
color:#111827;
}

main{
max-width:500px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
border:1px solid #ddd;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:white;
font-weight:bold;
cursor:pointer;
}

.primary{
background:#111827;
color:white;
}

.hidden{
display:none;
}

</style>

</head>


<body>

<main>


<div id="loginBox" class="card">

<h2>🔐 আমার হিসাব Pro</h2>

<p>নিজের Cloud হিসাব দেখতে Login করুন</p>


<input id="email"
placeholder="Email">


<input id="password"
type="password"
placeholder="Password">


<button id="signupBtn">
নতুন Account তৈরি
</button>


<button id="loginBtn" class="primary">
Login
</button>


<p id="msg"></p>

</div>



<div id="appBox" class="hidden">

<div class="card">

<h2>আমার হিসাব Pro</h2>

<p>Login সফল হয়েছে ✅</p>


<button id="logoutBtn">
Logout
</button>


</div>


</div>


</main>



<script>


const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



const email=document.getElementById("email");
const password=document.getElementById("password");
const msg=document.getElementById("msg");


signupBtn.onclick=async()=>{


let {error}=await supabaseClient.auth.signUp({

email:email.value,

password:password.value

});


if(error)
msg.innerText=error.message;

else
msg.innerText="Account তৈরি হয়েছে। Email check করুন।";


};



loginBtn.onclick=async()=>{


let {error}=await supabaseClient.auth.signInWithPassword({

email:email.value,

password:password.value

});


if(error)

msg.innerText=error.message;


else{

loginBox.classList.add("hidden");

appBox.classList.remove("hidden");

}


};



logoutBtn.onclick=async()=>{

await supabaseClient.auth.signOut();

appBox.classList.add("hidden");

loginBox.classList.remove("hidden");

};



</script>


</body>
</html>
